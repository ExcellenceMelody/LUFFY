name: Sync README TODO List

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/sync-readme-todo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme-todo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch main for merge-base
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Generate validated README update
        run: |
          cat > /tmp/apply_todo_sync.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import difflib
          import os
          import re
          import subprocess
          from collections import Counter
          from pathlib import Path

          repo = Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          readme_path = repo / "README.md"
          heading_exact = "### \U0001f4dd Complete TODO List"
          heading_re = re.compile(r"(?m)^###[^\n]*Complete TODO List[^\n]*$")
          entry_re = re.compile(r"^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<text>.*)$")

          expected_changed = {
              "luffy/deepscaler/utils.py",
              "luffy/verl/verl/protocol.py",
          }
          expected_utils = [
              (45, "Add logging for API calls and errors"),
              (46, "Support batch processing for multiple prompts"),
              (47, "Add timeout configuration for API calls"),
              (107, "Implement Vertex AI initialization and authentication"),
              (108, "Configure safety settings for content generation"),
              (109, "Set up GenerativeModel with proper system instructions"),
              (110, "Implement retry logic with exponential backoff"),
              (111, "Add comprehensive error handling for API access issues"),
              (112, "Handle rate limiting and quota management"),
              (113, "Implement response validation and text extraction"),
              (114, "Add support for different generation configurations"),
          ]
          expected_protocol = [
              (114, "Optimize memory usage during tensor reshaping"),
              (115, "Add support for different tensor types and shapes"),
              (136, "Optimize tensor view operations for performance"),
              (137, "Add error handling for invalid batch dimensions"),
              (169, "(zhangchi.usc1992) add consistency check"),
              (265, "we can actually lift this restriction if needed"),
              (351, "(zhangchi.usc1992) whether to copy"),
          ]
          expected_done_texts = {
              "luffy/deepscaler/utils.py": [
                  "Implement OpenAI API client initialization",
                  "Add proper authentication handling",
                  "Implement exponential backoff retry logic for rate limits",
                  "Add comprehensive error handling for different API errors",
                  "Implement response parsing and validation",
              ],
              "luffy/verl/verl/protocol.py": [
                  "Implement batch dimension folding for efficient processing",
                  "Add validation for batch size compatibility",
                  "Handle edge cases where batch_size is not divisible by new_batch_size",
                  "Implement batch dimension unfolding functionality",
                  "Add support for variable batch dimensions",
                  "Handle non-tensor batch data reshaping properly",
              ],
          }

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], cwd=repo, text=True).strip()

          def scan_python_text(text: str):
              found = []
              for lineno, line in enumerate(text.splitlines(), 1):
                  match = re.search(r"#\s*TODO\b(.*)$", line)
                  if not match:
                      continue
                  rest = match.group(1)
                  if rest.startswith(":"):
                      rest = rest[1:]
                  found.append((lineno, rest.strip()))
              return found

          def scan_path(path: str):
              disk_path = repo / path
              if disk_path.exists():
                  return scan_python_text(disk_path.read_text(encoding="utf-8"))
              return scan_python_text(git("show", f"HEAD:{path}"))

          base = git("merge-base", "HEAD", "origin/main")
          changed_py = set(filter(None, git(
              "diff", "--name-only", "--diff-filter=ACDMRTUXB", base, "HEAD", "--", "*.py"
          ).splitlines()))
          if changed_py != expected_changed:
              raise SystemExit(f"Refusing update; changed Python files are {sorted(changed_py)}")

          # The helper workflow commits are not code changes. Verify the two Python blobs are
          # still exactly the blobs from the dev code commit being synchronized.
          dev_code_commit = "7463fefd0f55ae2ba0b919e06527588022893495"
          for path in sorted(changed_py):
              head_blob = git("rev-parse", f"HEAD:{path}")
              code_blob = git("rev-parse", f"{dev_code_commit}:{path}")
              if head_blob != code_blob:
                  raise SystemExit(f"{path} differs from dev code commit: {head_blob} != {code_blob}")

          scanned = {path: scan_path(path) for path in sorted(changed_py)}
          if scanned["luffy/deepscaler/utils.py"] != expected_utils:
              raise SystemExit(f"Unexpected utils.py TODOs: {scanned['luffy/deepscaler/utils.py']!r}")
          if scanned["luffy/verl/verl/protocol.py"] != expected_protocol:
              raise SystemExit(f"Unexpected protocol.py TODOs: {scanned['luffy/verl/verl/protocol.py']!r}")

          original = readme_path.read_text(encoding="utf-8")
          heading_match = heading_re.search(original)
          if not heading_match or heading_match.group(0) != heading_exact:
              raise SystemExit(f"Required unchanged heading not found: {heading_match.group(0) if heading_match else None!r}")

          heading_line_end = original.index("\n", heading_match.end()) + 1
          next_h2 = re.search(r"(?m)^##\s+", original[heading_line_end:])
          if not next_h2:
              raise SystemExit("Could not find end of Complete TODO List section")
          section_end = heading_line_end + next_h2.start()
          prefix = original[:heading_line_end]
          old_section = original[heading_line_end:section_end]
          suffix = original[section_end:]

          old_matches = list(entry_re.finditer(old_section))
          if len(old_matches) != 226:
              raise SystemExit(f"Expected 226 baseline entries, found {len(old_matches)}")
          section_start_line = original[:heading_line_end].count("\n") + 1
          for offset, line in enumerate(old_section.splitlines(), start=section_start_line):
              if line.strip() and not entry_re.match(line):
                  raise SystemExit(f"Non-entry content in TODO section at line {offset}: {line!r}")

          old_entries = [
              (m.group("path"), int(m.group("line")), m.group("text"))
              for m in old_matches
          ]
          if [(p, l) for p, l, _ in old_entries] != sorted((p, l) for p, l, _ in old_entries):
              raise SystemExit("Baseline README entries are not sorted by path and line")

          changed_old = [entry for entry in old_entries if entry[0] in changed_py]
          kept_entries = [entry for entry in old_entries if entry[0] not in changed_py]
          new_changed = []
          for path in sorted(changed_py):
              new_changed.extend((path, line, text) for line, text in scanned[path])

          # Preserve all surviving TODO text. A text-count diff identifies completed items.
          for path in sorted(changed_py):
              old_text_counts = Counter(text for p, _, text in changed_old if p == path)
              new_text_counts = Counter(text for p, _, text in new_changed if p == path)
              removed_counts = old_text_counts - new_text_counts
              added_counts = new_text_counts - old_text_counts
              expected_removed = Counter(expected_done_texts[path])
              if removed_counts != expected_removed or added_counts != Counter():
                  raise SystemExit(
                      f"TODO text change mismatch for {path}: removed={removed_counts!r}, "
                      f"added={added_counts!r}, expected_removed={expected_removed!r}"
                  )

          merged_entries = kept_entries + new_changed
          merged_entries.sort(key=lambda entry: (entry[0], entry[1]))
          if len(kept_entries) != 197 or len(changed_old) != 29 or len(new_changed) != 18:
              raise SystemExit(
                  f"Entry accounting failed: kept={len(kept_entries)}, "
                  f"old_changed={len(changed_old)}, new_changed={len(new_changed)}"
              )
          if len(merged_entries) != 215:
              raise SystemExit(f"Expected 215 final entries, got {len(merged_entries)}")
          sort_keys = [(path, line) for path, line, _ in merged_entries]
          if sort_keys != sorted(sort_keys):
              raise SystemExit("Merged entries are not sorted by path and line")
          for path in sorted(changed_py):
              lines = [line for p, line, _ in merged_entries if p == path]
              if lines != sorted(lines):
                  raise SystemExit(f"Lines are not ascending for {path}")

          new_section = "\n" + "\n".join(
              f"- [ ] **{path}:{line}** - {text}"
              for path, line, text in merged_entries
          ) + "\n\n"
          updated = prefix + new_section + suffix
          if not updated.startswith(prefix) or not updated.endswith(suffix):
              raise SystemExit("Content outside the TODO heading/section was altered")
          if heading_exact not in updated:
              raise SystemExit("Original heading would be missing after update")
          if updated == original:
              raise SystemExit("Generated README is unexpectedly unchanged")

          diff = "".join(difflib.unified_diff(
              original.splitlines(keepends=True),
              updated.splitlines(keepends=True),
              fromfile="a/README.md",
              tofile="b/README.md",
          ))
          print(diff)
          print(f"Entry count: {len(old_entries)} -> {len(merged_entries)}")
          for path in sorted(changed_py):
              old_count = sum(p == path for p, _, _ in old_entries)
              new_count = sum(p == path for p, _, _ in merged_entries)
              print(f"{path}: {old_count} -> {new_count}")

          readme_path.write_text(updated, encoding="utf-8", newline="\n")
          print("README.md updated and validated successfully")
          PY
          python3 /tmp/apply_todo_sync.py

      - name: Show generated README diff
        run: git diff -- README.md

      - name: Commit and push README update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes were generated" >&2
            exit 1
          fi
          git commit -m "docs: sync Complete TODO List with dev"
          git push origin HEAD:dev
          git push origin --delete tmp-write-test-delete-me || true
