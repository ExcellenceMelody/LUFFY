name: Finalize TODO README sync
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/finalize-todo-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme-todo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch main for merge-base
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Validate, update, and push README
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import os, re, subprocess

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          readme = repo / "README.md"
          heading = "### \U0001f4dd Complete TODO List"

          def git(*args):
              return subprocess.check_output(["git", *args], cwd=repo, text=True).strip()

          def scan_todo_text(text):
              found = []
              for line_no, line in enumerate(text.splitlines(), 1):
                  match = re.search(r"#\s*TODO\b(.*)$", line)
                  if not match:
                      continue
                  todo = match.group(1)
                  if todo.startswith(":"):
                      todo = todo[1:]
                  found.append((line_no, todo.strip()))
              return found

          base = git("merge-base", "HEAD", "origin/main")
          changed_py = set(filter(None, git(
              "diff", "--name-only", "--diff-filter=ACDMRTUXB", base, "HEAD", "--", "*.py"
          ).splitlines()))
          expected_changed = {
              "luffy/deepscaler/utils.py",
              "luffy/verl/verl/protocol.py",
          }
          assert changed_py == expected_changed, changed_py

          all_py = [p for p in git("ls-files", "*.py").splitlines() if p]
          all_todo_count = sum(
              len(scan_todo_text((repo / p).read_text(encoding="utf-8")))
              for p in all_py
          )
          print(f"Searched all {len(all_py)} tracked Python files; {all_todo_count} TODO markers total.")

          scanned = {
              path: scan_todo_text((repo / path).read_text(encoding="utf-8"))
              for path in sorted(changed_py)
          }
          expected_lines = {
              "luffy/deepscaler/utils.py": [45, 46, 47, 107, 108, 109, 110, 111, 112, 113, 114],
              "luffy/verl/verl/protocol.py": [114, 115, 136, 137, 169, 265, 351],
          }
          expected_removed = {
              "luffy/deepscaler/utils.py": 5,
              "luffy/verl/verl/protocol.py": 6,
          }
          for path, line_numbers in expected_lines.items():
              assert [line_no for line_no, _ in scanned[path]] == line_numbers, (path, scanned[path])
          assert sum(len(items) for items in scanned.values()) == 18

          original = readme.read_text(encoding="utf-8")
          heading_match = re.search(r"(?m)^###[^\n]*Complete TODO List[^\n]*$", original)
          assert heading_match and heading_match.group(0) == heading
          body_start = original.index("\n", heading_match.end()) + 1
          next_h2 = re.search(r"(?m)^##\s+", original[body_start:])
          assert next_h2, "Could not find the H2 following the TODO section"
          body_end = body_start + next_h2.start()
          prefix = original[:body_start]
          old_body = original[body_start:body_end]
          suffix = original[body_end:]

          entry_re = re.compile(
              r"^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<text>.*)$",
              re.MULTILINE,
          )
          old_entries = []
          for line in old_body.splitlines():
              if not line.strip():
                  continue
              match = entry_re.fullmatch(line)
              assert match, f"Invalid TODO entry encountered: {line!r}"
              old_entries.append((match.group("path"), int(match.group("line")), match.group("text")))

          assert len(old_entries) == 226, len(old_entries)
          old_keys = [(path, line_no) for path, line_no, _ in old_entries]
          assert old_keys == sorted(old_keys), "Baseline entries are not sorted"

          kept_entries = [entry for entry in old_entries if entry[0] not in changed_py]
          old_changed_entries = [entry for entry in old_entries if entry[0] in changed_py]
          assert (len(kept_entries), len(old_changed_entries)) == (197, 29)

          new_changed_entries = []
          for path in sorted(changed_py):
              new_changed_entries.extend((path, line_no, text) for line_no, text in scanned[path])

          for path in sorted(changed_py):
              old_counts = Counter(text for p, _, text in old_changed_entries if p == path)
              new_counts = Counter(text for p, _, text in new_changed_entries if p == path)
              added = new_counts - old_counts
              removed = old_counts - new_counts
              assert not added, (path, added)
              assert sum(removed.values()) == expected_removed[path], (path, removed)
              print(f"{path}: {sum(old_counts.values())} -> {sum(new_counts.values())} entries; "
                    f"removed {sum(removed.values())} completed TODO item(s); line numbers refreshed.")

          merged_entries = kept_entries + new_changed_entries
          merged_entries.sort(key=lambda entry: (entry[0], entry[1]))
          assert len(merged_entries) == 215, len(merged_entries)
          merged_keys = [(path, line_no) for path, line_no, _ in merged_entries]
          assert merged_keys == sorted(merged_keys), "Merged entries are not sorted"
          for path in sorted(changed_py):
              path_lines = [line_no for p, line_no, _ in merged_entries if p == path]
              assert path_lines == sorted(path_lines), path

          new_body = "\n" + "\n".join(
              f"- [ ] **{path}:{line_no}** - {text}"
              for path, line_no, text in merged_entries
          ) + "\n\n"
          updated = prefix + new_body + suffix
          assert updated != original
          assert heading in updated
          assert updated[:len(prefix)] == prefix
          assert updated[-len(suffix):] == suffix
          readme.write_text(updated, encoding="utf-8", newline="\n")
          print(f"Validated and updated README TODO entries: {len(old_entries)} -> {len(merged_entries)}.")
          PY

          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "ERROR: README.md was not modified" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync Complete TODO List with dev"
          git push origin HEAD:dev
          git push origin --delete tmp-write-test-delete-me || true
