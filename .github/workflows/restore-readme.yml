name: restore-todo-readme
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore verified 215-item Complete TODO List
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 3bef3581033e62fa7038280f10bb9700d38629c1 -- README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "README already matches the verified TODO list"
          else
            git commit -m "docs: restore 215-item Complete TODO List"
            git push origin HEAD:dev
          fi
